[project]
name = "specsmooth"
version = "0.1.0"
description = "Multitaper spectral estimation viewed as kernel smoothing of a tapered periodogram"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["specsmooth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
